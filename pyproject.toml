[project]
name = "microDuckLocomotion"
version = "0.1.0"
description = "Learning bipedal locomotion for the Microduck from scratch with our own PPO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mjlab-microduck",
    "mjlab==1.3.0",
    "mujoco==3.10.0",
    "mujoco-warp==3.8.1",
    "warp-lang==1.12.0",
    "torch==2.9.1",
    "better-actuator-models",
    "scipy>=1.16",
    "matplotlib>=3.10",
    "wandb",
    "tensorboard",
]

# microduck_rl and the BAM actuator model aren't on PyPI, these pin the exact commits we tested against
[tool.uv.sources]
mjlab-microduck = { git = "https://github.com/pollen-robotics/microduck_rl.git", rev = "0daab160d3fb1c2cbaba16a4a19052f36709dd9e" }
better-actuator-models = { git = "https://github.com/Rhoban/bam.git", rev = "62bd8ce12154340be97e06f7f41a0ca8f116d967" }

[tool.uv]
# same overrides microduck_rl uses. bam pins an old protobuf that drags onnx down to a version with no wheels
override-dependencies = [
    "protobuf>=4.0,<7.0",
    "onnx>=1.20.1",
    "zmq ; python_version < '3.0'",
]

[build-system]
requires = ["uv_build>=0.8.19,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "duckWalk"
module-root = ""
